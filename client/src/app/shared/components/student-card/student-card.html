<a
  [routerLink]="['/students', student.id]"
  class="student-card glass-surface glass-noise glass-card block hover:bg-white/10 transition"
  style="text-decoration: none"
>
  <div class="student-card__body">
    <!-- Top row: U + name/email + status -->
    <div class="flex items-start gap-4">
      <div class="avatar">
        @if (student.avatarUrl) {
          <img [src]="student.avatarUrl" [alt]="student.name" />
        } @else {
          {{ student.name?.[0] }}{{ student.name?.split(' ')?.[1]?.[0] ?? '' }}
        }
      </div>

      <!-- Text area can shrink safely -->
      <div class="flex-1 min-w-0">
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <div class="text-lg font-semibold text-white/95 leading-tight truncate-1">
              {{ student.name }}
            </div>
          </div>

          <span
            class="badge shrink-0"
            [class.badge--active]="student.status === 'Active'"
            [class.badge--inactive]="student.status !== 'Active'"
            [class.badge--graduated]="student.status === 'Graduated'"
          >
            <span class="badge-dot"></span>
            {{ student.status }}
          </span>
        </div>

        <div class="mt-3 text-sm text-white/80 truncate-1">
          <div class="mt-1 text-sm text-white/60 truncate-1">
            {{ student.email }}
          </div>

          <div class="text-white/75 truncate-1">
            <span class="text-white/55">HNBR:</span>
            <span class="ml-2 font-medium text-white/90">{{ student.hnbr || '—' }}</span>
          </div>

          <!-- <div class="text-white/75 truncate-1">
            <span class="text-white/60">phone:</span>
            <span class="ml-1 font-medium text-white/90">{{ student.phone }}</span>
          </div> -->
        </div>
      </div>
    </div>

    <!-- Bottom hint pinned to bottom -->
    <div class="mt-auto pt-3 text-xs text-white/50">Click to view details →</div>
  </div>
</a>
