<div class="gp">
  @if (label) {
    <!-- <label class="gp__label">{{ label }}</label> -->
  }

  <div class="gp__seg" [class.is-open]="open">
    <!-- Country trigger -->
    <button
      type="button"
      class="gp__country"
      (click)="toggle()"
      [disabled]="disabled"
      [attr.aria-expanded]="open"
      aria-haspopup="listbox"
      [attr.aria-label]="'Select country code'"
      title="Select country code"
    >
      <!-- ✅ Flag (SVG via flag-icons) -->
      <span
        class="gp__flag fi"
        [ngClass]="'fi-' + (selected?.iso2 || selected?.key || 'bd').toLowerCase()"
        aria-hidden="true"
      ></span>

      <!-- ✅ Dial code -->
      <span class="gp__countryText">
        +{{ selected?.dialCode ?? selected?.dial?.replace('+', '') ?? '' }}
      </span>

      <span class="gp__chev" aria-hidden="true"></span>
    </button>

    <!-- Number -->
    <input
      class="gp__input"
      type="tel"
      [disabled]="disabled"
      [value]="national"
      (input)="onInput($event)"
      (blur)="onBlur()"
      [placeholder]="placeholder"
      aria-label="Phone number"
    />
  </div>

  <!-- Menu -->
  @if (open) {
    <div class="gp__menu glass-surface glass-noise" role="listbox">
      @for (c of countries; track c.iso2 ?? c.key) {
        <button
          type="button"
          class="gp__option"
          (click)="selectCountry(c)"
          role="option"
          [attr.aria-selected]="(c.iso2 ?? c.key) === (selected?.iso2 ?? selected?.key)"
        >
          <!-- ✅ Flag -->
          <span
            class="gp__optFlag fi"
            [ngClass]="'fi-' + (c.iso2 ?? c.key).toLowerCase()"
            aria-hidden="true"
          ></span>

          <span class="gp__optLabel">{{ c.name }}</span>

          <!-- ✅ Dial -->
          <span class="gp__optDial"> +{{ c.dialCode ?? c.dial?.replace('+', '') ?? '' }} </span>
        </button>
      }
    </div>
  }
</div>
