<header class="sticky top-0 z-50">
  <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8">
    <!-- Glass Bar -->
    <div
      class="glass-bar mt-4 rounded-2xl border border-white/15 bg-white/10 backdrop-blur-xl shadow-lg"
    >
      <div class="flex items-center justify-between px-3 sm:px-4 py-3">
        <!-- Brand -->
        <a
          routerLink="/students"
          (click)="closeMenu()"
          class="flex items-center gap-3 select-none no-underline"
        >
          <div class="glass-icon h-9 w-9 rounded-xl border border-white/15 bg-white/10"></div>

          <div class="leading-tight">
            <div class="font-semibold tracking-tight text-white/95">Student Dashboard</div>
            <div class="text-xs text-white/60">Learning build</div>
          </div>
        </a>

        <!-- Desktop Nav -->
        <nav class="hidden sm:flex items-center gap-1">
          <a
            *ngFor="let item of navItems"
            [routerLink]="item.href"
            routerLinkActive="nav-pill--active"
            [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
            class="nav-pill rounded-xl border border-transparent px-3 py-2 text-sm text-white/80 hover:text-white/95 hover:bg-white/10 transition no-underline"
          >
            {{ item.label }}
          </a>
        </nav>

        <!-- Right side actions -->
        <div class="flex items-center gap-2">
          <!-- Optional: small “status dot” to feel premium -->
          <div class="hidden sm:block h-2 w-2 rounded-full bg-white/40"></div>

          <!-- Mobile menu button -->
          <button
            type="button"
            (click)="toggleMenu()"
            class="sm:hidden inline-flex items-center justify-center rounded-xl border border-white/15 bg-white/10 px-3 py-2 text-white/90 hover:bg-white/15 transition"
            [attr.aria-expanded]="isMenuOpen"
            aria-label="Toggle navigation menu"
          >
            <!-- icon -->
            <svg
              *ngIf="!isMenuOpen"
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
            >
              <path
                d="M4 6h16M4 12h16M4 18h16"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>

            <svg
              *ngIf="isMenuOpen"
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
            >
              <path
                d="M6 6l12 12M18 6L6 18"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>
      </div>

      <!-- Mobile Nav Panel -->
      <div *ngIf="isMenuOpen" class="sm:hidden px-3 pb-3">
        <div class="rounded-xl border border-white/12 bg-white/8 backdrop-blur-xl p-2">
          <a
            *ngFor="let item of navItems"
            [routerLink]="item.href"
            (click)="closeMenu()"
            routerLinkActive="nav-pill--active"
            [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
            class="block nav-pill rounded-lg border border-transparent px-3 py-2 text-sm text-white/85 hover:bg-white/10 transition no-underline"
          >
            {{ item.label }}
          </a>
        </div>
      </div>
    </div>
  </div>
</header>
