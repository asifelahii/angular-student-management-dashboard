<div class="glass-surface glass-noise glass-card">
  <div class="flex items-start justify-between gap-4">
    <div>
      <h1 class="text-2xl font-semibold">Students</h1>
      <!-- <p class="mt-1 text-sm text-muted">Browse students. Click a card to view details.</p> -->
    </div>

    <button type="button" class="glass-btn" style="width: auto" (click)="onAddStudent()">
      Add Student
    </button>
  </div>

  <div class="mt-6 grid gap-4 sm:grid-cols-2 lg:grid-cols-3 items-stretch">
    @for (s of students; track s.id) {
    <app-student-card [student]="s" />
    }
  </div>

  @if (!students || students.length === 0) {
  <div class="mt-6 glass-surface glass-noise glass-card text-center">
    <div class="text-lg font-semibold text-white/90">No students found</div>
    <p class="mt-2 text-sm text-muted">
      Your student list is empty right now. Click
      <span class="text-white/90 font-semibold">Add Student</span> to start.
    </p>
  </div>
  }
</div>
